name: Tests

on:
  pull_request:
    paths:
      - "whitenoise-ios/**"
      - "whitenoise-iosTests/**"
      - "Shared/**"
      - "NotificationServiceExtension/**"
      - "Vendored/**"
      - "Config/**"
      - "whitenoise-ios.xcodeproj/**"
      - "Packages/**"
      - "scripts/sync-local-bindings.sh"
      - "scripts/check-analytics-release-config.py"
      - "scripts/check-marmotkit-bindings.py"
      - "scripts/tests/**"
      - "scripts/test.sh"
      - "scripts/test-with-relay.sh"
      - "scripts/test-relay/**"
      - "scripts/pick-simulator.sh"
      - ".github/workflows/tests.yml"
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: macos-15
    # Allow runner setup and artifact upload around the bounded 40-minute test step.
    timeout-minutes: 55

    env:
      WN_TEST_DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      WN_TEST_SOURCE_PACKAGES: ${{ github.workspace }}/build/SourcePackages
      WN_TEST_COMPILATION_CACHE: ${{ github.workspace }}/build/CompilationCache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      # Extracting the compiler cache ran out of disk alongside the image's
      # unused Xcodes, simulator runtimes and toolchains, so drop them first.
      - name: Free runner disk
        run: |
          df -h /
          keep="$(dirname "$(dirname "$(xcode-select -p)")")"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$(cd "$keep" && pwd -P)" ] || sudo rm -rf "$x" &
          done
          xcrun simctl runtime list -j \
            | python3 -c 'import json,sys; [print(k) for k,v in json.load(sys.stdin).items() if not v["platformIdentifier"].endswith("iphonesimulator") or not v["version"].startswith("26")]' \
            | xargs -n1 xcrun simctl runtime delete || true
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.ghcup &
          wait
          df -h /

      - name: Verify published MarmotKit provenance
        run: python3 scripts/check-marmotkit-bindings.py

      - name: Test release configuration checks
        run: python3 -m unittest discover -s scripts/tests

      # The MarmotKit binary target is a 74 MB download that unpacks to 254 MB.
      # It only changes when the pinned release does, so key it on the manifest.
      - name: Cache Swift package artifacts
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-xcode26-${{ hashFiles('Packages/MarmotKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26-

      - name: Isolate simulator clipboard
        # Host clipboard sync can stall UIPasteboard reads and block MainActor tests.
        run: defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false

      # Compiler cache keys hash compiler inputs rather than file mtimes, so a
      # fresh checkout still replays cached objects. Only master writes the
      # cache; pull requests read master's copy and never evict each other.
      # To disable, drop WN_TEST_COMPILATION_CACHE from the job env above.
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@v4
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-xcode26-${{ github.sha }}
          restore-keys: |
            cas-${{ runner.os }}-xcode26-

      - name: Install relay fixture toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"

      - name: Build isolated Nostr relay
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "1"
        run: cargo build --locked --manifest-path scripts/test-relay/Cargo.toml --target-dir build/TestRelay

      - name: Run tests
        # End the step before the job deadline so failure artifacts can upload.
        timeout-minutes: 40
        run: ./scripts/test-with-relay.sh

      - name: Export native test execution counts
        if: always()
        env:
          TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bundle="build/TestResults.xcresult"
          if [ ! -d "$bundle" ]; then
            echo "::notice::No XCResult bundle was produced; native execution counts are unavailable."
            exit 0
          fi
          umask 077
          raw_summary="$RUNNER_TEMP/TestResults-summary-private.json"
          trap 'rm -f "$raw_summary"' EXIT
          xcrun xcresulttool get test-results summary --path "$bundle" > "$raw_summary"
          export TEST_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export TEST_CHECKOUT_TREE="$(git rev-parse 'HEAD^{tree}')"
          python3 - "$raw_summary" <<'PYTHON'
          import json
          import os
          import sys
          from pathlib import Path

          raw = json.loads(Path(sys.argv[1]).read_text())
          for key in ("totalTestCount", "passedTests", "failedTests", "skippedTests"):
              if key not in raw or type(raw[key]) is not int or raw[key] < 0:
                  raise ValueError("Missing or invalid native count field: " + key)
          fields = ("totalTestCount", "passedTests", "failedTests", "skippedTests",
                    "expectedFailures", "result", "startTime", "finishTime", "duration")
          summary = {key: raw[key] for key in fields if key in raw}
          # Preserve per-configuration native counts separately; parameterized
          # runs and definition counts must never be added together.
          if "devicesAndConfigurations" in raw:
              summary["devicesAndConfigurations"] = [
                  {key: row[key] for key in fields if key in row}
                  for row in raw["devicesAndConfigurations"]
              ]
          report = {
              "provenance": {
                  "checkout_sha": os.environ["TEST_CHECKOUT_SHA"],
                  "checkout_tree": os.environ["TEST_CHECKOUT_TREE"],
                  "source_sha": os.environ["TEST_SOURCE_SHA"],
                  "event_sha": os.environ["GITHUB_SHA"],
                  "command": ["xcrun", "xcresulttool", "get", "test-results", "summary",
                              "--path", "build/TestResults.xcresult"],
              },
              "summary": summary,
              "counts_note": "Native summary fields retained verbatim; no cross-configuration or parameterized-run totals are synthesized.",
          }
          Path("build/TestResults-summary.json").write_text(json.dumps(report, indent=2) + "\n")
          PYTHON

      - name: Upload native test execution counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-summary
          path: build/TestResults-summary.json
          if-no-files-found: warn

      - name: Save compilation cache
        if: always() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: build/CompilationCache
          key: cas-${{ runner.os }}-xcode26-${{ github.sha }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          if-no-files-found: warn
